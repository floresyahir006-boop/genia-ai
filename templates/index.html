<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genia AI - Generador por Lote</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 40px;
        }
        h2 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            padding: 15px;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: 2px solid #2dd4bf;
        }
        .btn-submit {
            width: 100%;
            background-color: #2dd4bf;
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #14b8a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2># Imágenes por lote de 100</h2>
        <form action="/generar-lote-ia" method="POST" id="form-lote">
            <textarea id="input-prompt" placeholder="Escribe tus instrucciones aquí..." required></textarea>
            <button type="submit" class="btn-submit">+ Generar imágenes</button>
        </form>
    </div>

    <script>
        document.getElementById('form-lote').addEventListener('submit', function(e) {
            e.preventDefault();
            const promptValue = encodeURIComponent(document.getElementById('input-prompt').value);
            this.action = /generar-lote-ia?prompt=${promptValue};
            this.submit();
        });
    </script>

</body>
</html>
